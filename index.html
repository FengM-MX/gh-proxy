<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 文件加速</title>
    <!-- 引入 Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- 引入 Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <style>
        :root {
            --navbar-height: 56px;
        }
        
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            padding-top: calc(var(--navbar-height) * 2);
        }

        main {
            flex: 1 0 auto;
            padding: 40px 20px 20px;
        }

        .github-corner:hover .octo-arm {
            animation: octocat-wave 560ms ease-in-out
        }

        @keyframes octocat-wave {
            0%, 100% { transform: rotate(0) }
            20%, 60% { transform: rotate(-25deg) }
            40%, 80% { transform: rotate(10deg) }
        }

        @media (max-width: 500px) {
            .github-corner:hover .octo-arm {
                animation: none
            }

            .github-corner .octo-arm {
                animation: octocat-wave 560ms ease-in-out
            }
        }

        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #ffffff33;
            transition: all 0.3s ease;
        }

        .card-content {
            color: #e0e0e0;
            padding: 20px;
        }

        .card-title {
            color: #fff;
            font-size: 1.5rem;
        }

        .result-container {
            margin-top: 30px;
            display: none;
        }

        .action-buttons {
            margin-top: 15px;
        }

        /* 输入框样式 - 方形四角圆形 */
        .url-input {
            border: 1px solid #444;
            border-radius: 8px;
            padding: 0 15px;
            height: 46px;
            box-sizing: border-box;
            width: 100%;
            font-size: 16px;
            background-color: #2d2d2d;
            color: #fff;
        }

        .url-input:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 1px 0 0 #2196F3;
        }

        .url-input::placeholder {
            color: #aaa;
        }

        /* 按钮样式 - 方形四角圆形 */
        .convert-btn {
            border-radius: 8px;
            height: 46px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            text-transform: none;
            margin: 0;
            width: 100%;
        }

        /* 结果区域按钮样式 - 增大按钮 */
        .result-actions .btn-small {
            border-radius: 8px;
            margin-right: 15px;
            margin-bottom: 15px;
            height: 40px;
            padding: 0 20px;
            font-size: 1rem;
        }

        .result-actions .btn-small i {
            font-size: 1.2rem;
        }

        .result-actions .btn-small:last-child {
            margin-right: 15px;
        }

        /* 顶部导航栏样式 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--navbar-height);
            background: #2d3138;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        .navbar-title {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 500;
            margin: 0;
            display: flex;
            align-items: center;
        }

        .navbar-title i {
            margin-right: 10px;
            color: #fff;
        }

        /* 输入框和按钮同行布局 */
        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 0;
        }

        .input-field {
            flex: 1;
        }

        .button-field {
            flex: 0 0 auto;
        }

        /* 卡片容器 */
        .input-card {
            border: 1px solid #ffffff33;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            background: #1e1e1e;
        }

        .result-card {
            border: 1px solid #ffffff33;
            border-radius: 12px;
            background: #1e1e1e;
        }

        @media (max-width: 600px) {
            .input-row {
                flex-direction: column;
            }
            
            .button-field {
                flex: 1;
            }
        }

        /* 响应式设计 */
        @media (min-width: 601px) {
            .convert-btn {
                width: auto;
                display: inline-flex;
            }
            
            .button-field {
                width: auto;
            }
        }

        @media (max-width: 600px) {
            body {
                padding-top: calc(var(--navbar-height) * 2);
            }
            
            .navbar-title {
                font-size: 1.2rem;
            }
            
            main {
                padding: 30px 15px 15px;
            }
            
            .card {
                padding: 15px;
            }
            
            .result-actions .btn-small {
                width: 100%;
                margin-right: 0;
            }
        }
        .link-text {
            padding: 12px 0;
            word-break: break-all;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 0.95rem;
            line-height: 1.7;
            background: rgba(240, 240, 240, 0.37);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            color: var(--text-color);
        }
    </style>
</head>

<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <h1 class="navbar-title">
            <i class="material-icons">code</i>
            GitHub 文件加速
        </h1>
    </nav>

    <main>
        <div class="container">
            <!-- 输入框卡片 -->
            <div class="card input-card">
                <div class="row">
                    <form class="col s12" id="urlForm">
                        <div class="row">
                            <div class="col s12">
                                <div class="input-row">
                                    <div class="input-field">
                                        <input 
                                            id="urlInput" 
                                            class="url-input"
                                            type="url" 
                                            placeholder="请输入 GitHub 文件链接"
                                            pattern="^((https|http):\/\/)?(github\.com\/.+?\/.+?\/(?:releases|archive|blob|raw|suites)|((?:raw|gist)\.(?:githubusercontent|github)\.com))\/.+$"
                                            required
                                        >
                                    </div>
                                    <div class="button-field">
                                        <button class="btn waves-effect waves-light blue convert-btn" id="convertBt" type="button">
                                            <i class="material-icons left">flash_on</i>
                                            转换链接
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 结果显示区域 -->
            <div id="resultContainer" class="result-container">
                <div class="card result-card">
                    <div class="card-content white-text">
                        <span class="card-title">转换后的链接</span>
                        <div class="link-text">
                            <p id="convertedUrl" style="word-break: break-all; margin: 20px 0; font-size: 1.1rem;"></p>
                        </div>
                    </div>
                    <div class="card-action action-buttons result-actions">
                        <button id="copyBtn" class="btn-small waves-effect waves-light green" type="button">
                            <i class="material-icons left">content_copy</i>
                            复制
                        </button>
                        <button id="openBtn" class="btn-small waves-effect waves-light orange" type="button">
                            <i class="material-icons left">open_in_new</i>
                            打开
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 引入 Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    
    <script>
        // 初始化 Materialize 组件
        document.addEventListener('DOMContentLoaded', function() {
            M.AutoInit();
        });

        // 表单提交处理
        document.getElementById('convertBt').addEventListener('click', function() {
            const inputUrl = document.getElementById('urlInput').value;
            const baseUrl = window.location.origin + `'${CONTEXT_PATH}'`;
            const convertedUrl = baseUrl + inputUrl;
            
            // 显示结果
            document.getElementById('convertedUrl').textContent = convertedUrl;
            document.getElementById('resultContainer').style.display = 'block';
            
            // 保存转换后的链接供后续使用
            window.convertedUrl = convertedUrl;
        });

        // 复制按钮处理
        document.getElementById('copyBtn').addEventListener('click', function() {
            if (window.convertedUrl) {
                navigator.clipboard.writeText(window.convertedUrl)
                    .then(() => {
                        M.toast({html: '链接已复制到剪贴板!'});
                    })
                    .catch(err => {
                        M.toast({html: '复制失败: ' + err});
                    });
            }
        });

        // 打开按钮处理
        document.getElementById('openBtn').addEventListener('click', function() {
            if (window.convertedUrl) {
                window.open(window.convertedUrl, '_blank');
            }
        });
    </script>
</body>
</html>
